<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cyroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="50%" stop-color="#091322"/>
      <stop offset="100%" stop-color="#0e1d35"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="cyroBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Aurora Core Glow -->
    <radialGradient id="cyroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#0369a1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#050a14" stop-opacity="0"/>
    </radialGradient>

    <!-- Ice Crystal Main Gradient -->
    <linearGradient id="iceGradient" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Secondary Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Center Core Radial -->
    <radialGradient id="coreLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a5f3fc"/>
      <stop offset="80%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>

    <!-- Symmetrical Cryo Spoke -->
    <g id="spoke">
      <!-- Radial ray from core to outer hexagon vertex -->
      <line x1="256" y1="216" x2="256" y2="94" stroke="url(#iceGradient)" stroke-width="12" stroke-linecap="round"/>
      
      <!-- Snowflake chevron facet -->
      <polyline points="234,146 256,124 278,146" fill="none" stroke="url(#cyanGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Outer vertex glint node -->
      <circle cx="256" cy="90" r="5" fill="#a5f3fc"/>
    </g>
  </defs>

  <!-- Background Base Squircle (Universal visibility in light & dark browser tabs) -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#cyroBg)" stroke="url(#cyroBorder)" stroke-width="6"/>

  <!-- Ambient Cryo Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#cyroGlow)"/>

  <!-- Outer Hexagon Frame -->
  <polygon points="256,88 401.5,172 401.5,340 256,424 110.5,340 110.5,172"
           fill="none"
           stroke="url(#iceGradient)"
           stroke-width="20"
           stroke-linejoin="round"
           stroke-linecap="round"/>

  <!-- Inner Hexagon Frame -->
  <polygon points="256,168 332.2,212 332.2,300 256,344 179.8,300 179.8,212"
           fill="rgba(2, 132, 199, 0.12)"
           stroke="url(#cyanGrad)"
           stroke-width="8"
           stroke-linejoin="round"
           opacity="0.9"/>

  <!-- 6-Fold Cryo Snowflake Symmetry -->
  <use href="#spoke"/>
  <use href="#spoke" transform="rotate(60 256 256)"/>
  <use href="#spoke" transform="rotate(120 256 256)"/>
  <use href="#spoke" transform="rotate(180 256 256)"/>
  <use href="#spoke" transform="rotate(240 256 256)"/>
  <use href="#spoke" transform="rotate(300 256 256)"/>

  <!-- Central Luminous Cryo Core (Sub-Zero Nucleus) -->
  <polygon points="256,220 287.2,238 287.2,274 256,292 224.8,274 224.8,238"
           fill="url(#coreLight)"
           stroke="#ffffff"
           stroke-width="4"
           stroke-linejoin="round"/>

  <!-- Center Diamond Spark -->
  <path d="M 256 238 Q 256 256 242 256 Q 256 256 256 274 Q 256 256 270 256 Q 256 256 256 238 Z"
        fill="#ffffff"/>
  <circle cx="256" cy="256" r="3" fill="#ffffff"/>

  <!-- Ambient Cryo Sparkles -->
  <circle cx="86" cy="86" r="3.5" fill="#38bdf8" opacity="0.45"/>
  <circle cx="426" cy="86" r="3.5" fill="#38bdf8" opacity="0.45"/>
  <circle cx="86" cy="426" r="3.5" fill="#38bdf8" opacity="0.45"/>
  <circle cx="426" cy="426" r="3.5" fill="#38bdf8" opacity="0.45"/>
  <circle cx="256" cy="48" r="2.5" fill="#22d3ee" opacity="0.6"/>
  <circle cx="256" cy="464" r="2.5" fill="#22d3ee" opacity="0.6"/>
</svg>
