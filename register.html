<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Protocol | CyroCore</title>
    <meta name="description" content="Create an account at CyroCore to book cryotherapy sessions, infrared saunas, and save your recovery protocols.">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

    <!-- Core & Auth Stylesheets -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/rtl.css">

    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="auth-page-body">

    <!-- Top Corner Actions (Theme & RTL) -->
    <div class="auth-top-actions">
        <button class="icon-btn theme-toggle" aria-label="Toggle Dark Mode" type="button">
            <i class="ph ph-moon"></i>
        </button>
        <button class="icon-btn rtl-toggle" aria-label="Toggle RTL" type="button">
            <i class="ph ph-arrows-left-right"></i>
        </button>
    </div>

    <!-- Signup Card -->
    <main class="auth-card-modern auth-card-signup">
        <!-- Brand Header -->
        <a href="index.html" class="auth-brand-badge" aria-label="CyroCore Home">
            <img src="assets/images/cyrocore-logo.svg" alt="CyroCore" class="brand-logo">
        </a>

        <!-- Main Title & Subtitle -->
        <h1 class="auth-title">JOIN THE PROTOCOL</h1>
        <p class="auth-subtitle">Create an account to book sessions & save favorite modalities</p>

        <!-- Signup Form -->
        <form id="signupForm" novalidate>
            <!-- Full Name -->
            <div class="auth-form-group">
                <label class="auth-label" for="signupName">FULL NAME</label>
                <div class="auth-input-wrapper">
                    <input 
                        type="text" 
                        id="signupName" 
                        class="auth-input" 
                        placeholder="Alex Mercer" 
                        autocomplete="name" 
                        required>
                    <div class="auth-invalid-msg"></div>
                </div>
            </div>

            <!-- Email Address -->
            <div class="auth-form-group">
                <label class="auth-label" for="signupEmail">EMAIL ADDRESS</label>
                <div class="auth-input-wrapper">
                    <input 
                        type="email" 
                        id="signupEmail" 
                        class="auth-input" 
                        placeholder="member@cyrocore.com" 
                        autocomplete="email" 
                        required>
                    <div class="auth-invalid-msg"></div>
                </div>
            </div>

            <!-- Password -->
            <div class="auth-form-group">
                <label class="auth-label" for="signupPassword">PASSWORD</label>
                <div class="auth-input-wrapper auth-input-has-icon">
                    <input 
                        type="password" 
                        id="signupPassword" 
                        class="auth-input" 
                        placeholder="••••••••" 
                        autocomplete="new-password" 
                        required>
                    <button type="button" class="auth-password-toggle" aria-label="Toggle password visibility">
                        <i class="ph ph-eye"></i>
                    </button>
                    <div class="auth-invalid-msg"></div>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="auth-form-group">
                <label class="auth-label" for="signupConfirmPassword">CONFIRM PASSWORD</label>
                <div class="auth-input-wrapper auth-input-has-icon">
                    <input 
                        type="password" 
                        id="signupConfirmPassword" 
                        class="auth-input" 
                        placeholder="••••••••" 
                        autocomplete="new-password" 
                        required>
                    <button type="button" class="auth-password-toggle" aria-label="Toggle password visibility">
                        <i class="ph ph-eye"></i>
                    </button>
                    <div class="auth-invalid-msg"></div>
                </div>
            </div>

            <!-- Terms Checkbox Row -->
            <div class="auth-terms-row">
                <input type="checkbox" id="signupTerms" class="auth-checkbox" required>
                <label class="auth-terms-text" for="signupTerms">
                    I agree to the <a href="#">Terms & Conditions</a> and the <a href="#">Privacy Policy</a>.
                </label>
                <div class="auth-invalid-msg"></div>
            </div>

            <!-- Submit CTA -->
            <button type="submit" class="auth-submit-btn">
                CREATE ACCOUNT
            </button>
        </form>

        <!-- Minimalist OR Divider -->
        <div class="auth-divider">
            <span class="auth-divider-line"></span>
            <span class="auth-divider-text">OR</span>
            <span class="auth-divider-line"></span>
        </div>

        <!-- Social Auth Buttons -->
        <div class="auth-social-list">
            <button type="button" class="auth-social-btn" data-provider="Google">
                <svg width="19" height="19" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                </svg>
                <span>Continue with Google</span>
            </button>

            <button type="button" class="auth-social-btn" data-provider="Apple">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="#0f172a" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-2 .6-2.64 1.35-.57.65-1.06 1.73-.93 2.76 1.01.08 2.03-.51 2.65-1.26z"/>
                </svg>
                <span>Continue with Apple</span>
            </button>
        </div>

        <!-- Footer Link -->
        <div class="auth-card-footer">
            <span>Already have an account?</span>
            <a href="login.html" class="auth-footer-link">Login here</a>
        </div>
    </main>

    <!-- Interactive Scripts -->
    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
